# Checks that pages saved from the content editor (Pages CMS) build exactly
# like the hand-written ones. Run it from the Actions tab, or push a test/** branch.
name: Content editor round-trip

on:
  workflow_dispatch:
  push:
    branches: [ 'test/**' ]

jobs:
  roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build as-is
        run: npm run build && mv dist dist-before
      - name: Re-save every page the way the editor would
        run: node scripts/content-roundtrip.mjs && git diff --stat | tail -1
      - name: Build again
        run: npm run build
      - name: Compare
        run: |
          # graph.json carries a build timestamp; compare it without that.
          jq -S 'del(.generated)' dist-before/network/graph.json > a.json
          jq -S 'del(.generated)' dist/network/graph.json > b.json
          diff -q a.json b.json > /dev/null || echo "Files dist-before/network/graph.json and dist/network/graph.json differ (beyond the timestamp)" > graph-diff.txt
          diff -rq --exclude=graph.json dist-before dist > diff.txt; cat graph-diff.txt >> diff.txt 2>/dev/null
          if [ ! -s diff.txt ]; then
            echo "::notice title=Round-trip::Editor-style saves build identically ($(find dist -name '*.html' | wc -l) pages)."
          else
            echo "::error title=Round-trip::$(wc -l < diff.txt) files differ: $(head -c 3000 diff.txt | tr '\n' ' ')"
            f=$(grep -m1 -o 'dist/[^ ]*\.html' diff.txt || true)
            if [ -n "$f" ]; then
              b=${f/dist\//dist-before/}
              echo "::error title=First difference::$(diff <(sed 's/></>\n</g' "$b") <(sed 's/></>\n</g' "$f") | head -c 3500 | tr '\n' ' ')"
            fi
            exit 1
          fi
