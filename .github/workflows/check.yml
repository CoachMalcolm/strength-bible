name: Build check

# Builds every branch except main (which deploys) so changes can be tested
# before they go live. Nothing here touches the live site.
on:
  push:
    branches-ignore: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify built pages
        run: node scripts/verify-build.mjs
